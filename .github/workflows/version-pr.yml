name: Open version PR

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Package branch to release
        required: true
        type: choice
        options: [dev, teslemetry, tessie]
      bump:
        description: Version bump
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  version-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Bump version
        id: bump
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          release_branch="release/${{ inputs.branch }}-v${{ steps.bump.outputs.version }}"
          git checkout -b "$release_branch"
          git commit -am "chore(release): v${{ steps.bump.outputs.version }}"
          git push origin "$release_branch"
          gh pr create --base "${{ inputs.branch }}" --head "$release_branch" \
            --title "chore(release): v${{ steps.bump.outputs.version }}" \
            --body "Bumps \`${{ inputs.branch }}\` to v${{ steps.bump.outputs.version }}. Merging runs the CI gate on the merge commit and opens the approval-gated \`npm-publish\` deployment."
